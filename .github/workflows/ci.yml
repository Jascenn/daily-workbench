name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 兼容名 job：分支保护的必过检查仍要求「Logic tests (491 assertions)」这个历史检查名。
  logic-compat:
    name: Logic tests (491 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Key files present
        run: |
          test -f workbench.html
          test -f app.py
          test -f VERSION
          test -f scripts/sync/sections.py
          test -f scripts/build-workbench.py
          grep -q "function newsReaderBlocksHTML" workbench.html
          grep -q "function openNewsReader" workbench.html

  python:
    name: Python compile & workbench build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/build-workbench.py --check --lint-css
      - run: python3 -m py_compile app.py server/*.py scripts/build-workbench.py scripts/sync/*.py scripts/sync/social/*.py scripts/tools/*.py scripts/tests/*.py
      - run: bash -n scripts/sync-now.sh scripts/sync/daily-sync.sh scripts/tools/*.sh scripts/diagnostics/*.sh
