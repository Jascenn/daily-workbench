name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    name: Logic tests (491 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 仓库不带真实数据：先用夹具生成器造三份伪数据快照（data/sections/social），
      # 逻辑断言大多是「期望值从数据现算」，空数据会让一半断言失去意义。
      - name: Seed CI fixtures
        run: python3 scripts/tests/make-fixture.py
      - name: Run logic tests
        run: node scripts/tests/test-workbench-logic.mjs
  # smoke-ux.mjs 依赖本机 Playwright（绝对路径引入全局 npm 包）与本机 sync 服务，
  # 属于开发者本地冒烟，不进 CI —— 只在本地跑：node scripts/tests/smoke-ux.mjs

  python:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile app.py scripts/sync/*.py scripts/tools/*.py scripts/tests/*.py
      - run: bash -n scripts/sync-now.sh scripts/tools/*.sh scripts/diagnostics/*.sh
