name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 私有仓：logic / smoke 断言依赖本机真实数据快照与 Playwright，
  # 都只能在开发者本机跑（见 CONTRIBUTING 说明），CI 只做静态检查。
  python:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m py_compile app.py scripts/sync/*.py scripts/tools/*.py scripts/tests/*.py
      - run: bash -n scripts/sync-now.sh scripts/tools/*.sh scripts/diagnostics/*.sh
