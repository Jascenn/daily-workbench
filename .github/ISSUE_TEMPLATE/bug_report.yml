name: Bug report
description: Report a private development-mirror issue
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include real earnings, customer names, platform credentials, or
        local absolute paths. Use synthetic data whenever possible.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "main / e7af7a4"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed real private data, credentials, and local paths.
          required: true
        - label: This is not a private vulnerability report.
          required: true
